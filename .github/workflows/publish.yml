name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cli/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install skill script dependencies
        run: for req in skills/*/scripts/requirements.txt; do python3 -m pip install -r "$req"; done

      - run: pnpm install --frozen-lockfile
        working-directory: cli

      # The same gate set as CI and local (lint, format, types, tests, build, skill gates, security scan),
      # so a tag can never publish what CI would reject.
      - name: Full gate set
        run: pnpm run ci
        working-directory: cli

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; print it so an auth failure is easy to read.
      - run: npm --version

      - run: npm publish --provenance --access public
        working-directory: cli
