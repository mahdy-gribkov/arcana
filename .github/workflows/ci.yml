name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: cli

      - run: pnpm run build
        working-directory: cli

      - name: Skill gates (validate, cross-validate, quality floor, script tests)
        run: bash scripts/check-skills.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run security scan
        run: bash scripts/security-scan.sh

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
        working-directory: cli

      - run: pnpm audit --prod
        working-directory: cli

  cli-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: cli

      - name: Lint
        run: pnpm run lint
        working-directory: cli

      - name: Format check
        run: pnpm run format:check
        working-directory: cli

      - name: Type check
        run: pnpm exec tsc --noEmit
        working-directory: cli

      - name: Unit tests with coverage
        run: pnpm exec vitest run --coverage
        working-directory: cli

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cli/coverage/

      - name: Smoke test
        run: |
          pnpm run build
          node dist/index.js --version
          node dist/index.js --help
        working-directory: cli
